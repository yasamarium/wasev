name: WhatsApp Server Auto-Runner

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x ./cloudflared

      - name: Decrypt Token
        id: tok
        run: |
          python3 decrypt_token.py > /tmp/gh_tok.txt
          echo "done"

      - name: Start Server + Cloudflare Tunnel
        env:
          REPO_OWNER: yasamarium
          REPO_NAME: wasev
        run: |
          GH_TOKEN=$(cat /tmp/gh_tok.txt)

          node server.js &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          sleep 8

          ./cloudflared tunnel --url http://localhost:3000 --logfile cf.log &
          sleep 15

          CF_URL=$(grep -o 'https://[^ ]*trycloudflare\.com' cf.log | head -1)
          echo "Tunnel URL: $CF_URL"

          if [ -n "$CF_URL" ]; then
            SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/contents/server_url.txt" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

            CONTENT=$(echo -n "$CF_URL" | base64 -w 0)

            if [ -n "$SHA" ]; then
              curl -s -X PUT "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/contents/server_url.txt" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"message\":\"Update server URL\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}" > /dev/null
            else
              curl -s -X PUT "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/contents/server_url.txt" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"message\":\"Set server URL\",\"content\":\"$CONTENT\"}" > /dev/null
            fi
            echo "Server URL saved to GitHub"
          fi

          sleep 17370

          echo "Saving session before shutdown..."
          kill -TERM $SERVER_PID 2>/dev/null || true
          sleep 20

          SHA2=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/contents/server_url.txt" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          EMPTY=$(echo -n "" | base64 -w 0)
          if [ -n "$SHA2" ]; then
            curl -s -X PUT "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/contents/server_url.txt" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"message\":\"Clear URL on shutdown\",\"content\":\"$EMPTY\",\"sha\":\"$SHA2\"}" > /dev/null
          fi

          echo "Shutdown complete."
